[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scientific-representation"
version = "0.16.0"
description = "Framework for bounded scientific analysis and inspectable representation"
requires-python = ">=3.11"

[project.scripts]
scientific-representation = "scientific_representation.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
