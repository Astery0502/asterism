schema_version = 1
investigation = "<investigation-id>"

# Sole investigation-local registry for generated scientific products.

[[products]]
id = "<stable-product-id>"
title = "<human-readable title>"
kind = "figure"
status = "working"
paths = ["figures/<name>.png"]
# Prefix each dependency with product:, source:, or identity:.
inputs = ["source:<id>"]
generation = "<command, notebook entry point, or manual procedure>"
scientific_role = "<question, claim, or comparison this product serves>"
retention = "tracked | preserve | external | rebuildable | temporary"

# Add only when material:
# checks = ["<scientific-spine check or inspection evidence>"]
# interpretation = "<progress checkpoint or artifact path>"
# limitations = ["<material limitation>"]
# supersedes = "<prior-product-id>"
